name: Package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -B -m unittest discover -s tests
      - name: Check installed command outside the source tree
        working-directory: ${{ runner.temp }}
        run: tink-substrate --help
      - name: Install an independent skill package
        run: python scripts/install_skill.py --destination "${{ runner.temp }}/substrate-skill"
      - name: Check copied package outside the source tree
        working-directory: ${{ runner.temp }}/substrate-skill
        run: |
          python -m tink_substrate --help
          mkdir -p "${{ runner.temp }}/trial-target"
          python .substrate-tools/tink-sdlc/scripts/init.py "${{ runner.temp }}/trial-target" --check
